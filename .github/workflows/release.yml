name: Publish Pocketool

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve tag and build artifact
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^(?<id>.+)-v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag Pocketool no válido: $env:GITHUB_REF_NAME"
          }
          python scripts/build.py --pocketool $Matches.id --version $Matches.version
          "POCKETOOL_ID=$($Matches.id)" >> $env:GITHUB_ENV
          "POCKETOOL_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
      - name: Validate repository
        run: python scripts/test.py
      - name: Verify generated catalog is committed
        run: git diff --exit-code -- pocketools.catalog.json
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/$env:POCKETOOL_ID-$env:POCKETOOL_VERSION.zip"
          gh release create $env:GITHUB_REF_NAME $asset --generate-notes --verify-tag
